<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rally Atelier · 球台预约闭环原型</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <div>
      <p class="eyebrow">RALLY ATELIER</p>
      <h1>球台预约</h1>
    </div>
    <button id="profileButton" class="icon-button" type="button" aria-label="打开会员中心">FK</button>
  </header>

  <main id="main" class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <p class="eyebrow">今天 · 城市旗舰馆</p>
        <h2 id="hero-title">把下一场球，锁定下来。</h2>
        <p class="hero-copy">实时容量、明确后果、候补自动转正。系统不会在服务端确认前展示成功。</p>
      </div>
      <div class="hero-stat" aria-label="当前空闲球台">
        <span>可约</span>
        <strong id="availableCount">1</strong>
        <small>/ 2 台</small>
      </div>
    </section>

    <section class="section" aria-labelledby="session-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">黄金时段</p>
          <h2 id="session-title">19:00–20:00</h2>
        </div>
        <span id="statusBadge" class="status available">尚有名额</span>
      </div>

      <article class="court-card" aria-describedby="session-details">
        <div class="court-visual" aria-hidden="true">
          <div class="court-line"></div>
          <div class="court-net"></div>
        </div>
        <div class="court-content">
          <div>
            <p class="court-name">训练区 A · 2 张球台</p>
            <p id="session-details" class="muted">预约保留至开场前 10 分钟 · 取消后按 FIFO 自动转正</p>
          </div>
          <dl class="facts">
            <div><dt>场馆</dt><dd>城市旗舰馆</dd></div>
            <div><dt>价格</dt><dd>¥68 / 小时</dd></div>
            <div><dt>候补</dt><dd id="queueCount">0 人</dd></div>
          </dl>
        </div>
      </article>
    </section>

    <section class="section action-panel" aria-labelledby="action-title">
      <div>
        <p class="eyebrow">确认预约</p>
        <h2 id="action-title">你将预约 19:00 场次</h2>
        <p id="consequence" class="muted">提交后由服务端原子校验容量；已满时自动进入候补队列。</p>
      </div>
      <button id="reserveButton" class="primary-button" type="button">确认预约 · ¥68</button>
    </section>

    <section class="section" aria-labelledby="activity-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">状态追踪</p>
          <h2 id="activity-title">本次操作</h2>
        </div>
        <button id="resetButton" class="text-button" type="button">重置演示</button>
      </div>
      <div id="activity" class="activity empty" role="status" aria-live="polite">
        <div class="activity-mark" aria-hidden="true">○</div>
        <div>
          <strong>尚未提交</strong>
          <p>点击预约后查看成功、候补及自动转正状态。</p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
  <script src="app.js"></script>
</body>
</html>
