services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: agentic_sdlc
    volumes:
      - agentic-sdlc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d agentic_sdlc"]
      interval: 5s
      timeout: 5s
      retries: 20
  control-plane:
    build:
      context: .
      dockerfile: control_plane/Dockerfile
    environment:
      SDLC_DATABASE_URL: postgresql+psycopg://sdlc:change-me@postgres:5432/agentic_sdlc
      SDLC_BOOTSTRAP_TOKEN: change-this-bootstrap-token
      SDLC_MASTER_KEY_B64: replace-with-output-of-generate-master-key
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  agentic-sdlc-postgres:
